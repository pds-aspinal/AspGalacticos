<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --pitch: #14342b;
    --pitch-line: #1f5240;
    --paper: #f7f5ef;
    --gold: #c9a227;
    --ink: #14201c;
    --muted: #6b7770;
    --up: #2f7a4f;
    --down: #b5482f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  header {
    background: var(--pitch);
    color: var(--paper);
    padding: 2.5rem 1.5rem 3rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent 0 78px, var(--pitch-line) 78px 79px),
      repeating-linear-gradient(0deg, transparent 0 78px, var(--pitch-line) 78px 79px);
    opacity: 0.4;
  }
  header .inner { position: relative; max-width: 900px; margin: 0 auto; }
  h1 {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 0.25rem;
  }
  .subtitle { color: #cfe0d6; font-size: 0.95rem; }
  main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: -2rem 0 2rem; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; margin-top: -1.5rem; } }
  .card {
    background: white;
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    box-shadow: 0 6px 18px rgba(20,52,43,0.12);
    border-top: 4px solid var(--gold);
  }
  .card.low { border-top-color: var(--down); }
  .card .eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .card .name { font-family: 'Oswald', sans-serif; font-size: 1.3rem; margin: 0.2rem 0; }
  .card .pts { color: var(--muted); font-size: 0.9rem; }
  h2 {
    font-family: 'Oswald', sans-serif;
    text-transform: uppercase;
    font-size: 1.1rem;
    letter-spacing: 0.03em;
    border-bottom: 2px solid var(--pitch);
    padding-bottom: 0.4rem;
    margin: 2rem 0 1rem;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid #e3ddca; }
  th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank-up { color: var(--up); font-weight: 600; }
  .rank-down { color: var(--down); font-weight: 600; }
  .chart-wrap { background: white; border-radius: 10px; padding: 1rem; box-shadow: 0 6px 18px rgba(20,52,43,0.08); }
  .empty, .error { color: var(--muted); font-style: italic; padding: 1rem 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 0; }
</style>
</head>
<body>

<header>
  <div class="inner">
    <h1>League Table</h1>
    <div class="subtitle" id="league-meta">Loading current standings…</div>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card" id="winner-card">
      <div class="eyebrow">Gameweek winner</div>
      <div class="name">—</div>
      <div class="pts">—</div>
    </div>
    <div class="card low" id="loser-card">
      <div class="eyebrow">Gameweek wooden spoon</div>
      <div class="name">—</div>
      <div class="pts">—</div>
    </div>
  </div>

  <h2>Standings</h2>
  <div id="standings-wrap"><p class="empty">Loading…</p></div>

  <h2>Points progression</h2>
  <div class="chart-wrap"><canvas id="progressionChart" height="260"></canvas></div>

  <h2>Prize fund</h2>
  <div id="prize-wrap"><p class="empty">Loading…</p></div>

  <footer>Auto-updated weekly via GitHub Actions from the official FPL data</footer>
</main>

<script>
// ── Configure these two values (safe to expose publicly — this is the anon/read-only key) ──
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

async function sb(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
    }
  });
  if (!res.ok) throw new Error(`${path} -> ${res.status}`);
  return res.json();
}

function teamName(teams, id) {
  const t = teams.find(t => t.team_id === id);
  return t ? `${t.team_name} (${t.manager_name})` : `Team ${id}`;
}

async function render() {
  try {
    const teams = await sb("teams?select=team_id,team_name,manager_name");
    const rankings = await sb("league_rankings?select=*&order=gw.desc,league_rank.asc");

    if (!rankings.length) {
      document.getElementById("league-meta").textContent = "No data yet — waiting on the first collector run.";
      document.getElementById("standings-wrap").innerHTML = '<p class="empty">No gameweeks recorded yet.</p>';
      return;
    }

    const latestGw = rankings[0].gw;
    document.getElementById("league-meta").textContent = `After gameweek ${latestGw}`;

    const latest = rankings.filter(r => r.gw === latestGw);
    const prevRanks = {};
    rankings.filter(r => r.gw === latestGw - 1).forEach(r => prevRanks[r.team_id] = r.league_rank);

    // Weekly winner / loser cards
    const byGwPoints = [...latest].sort((a, b) => b.gw_points - a.gw_points);
    const winner = byGwPoints[0], loser = byGwPoints[byGwPoints.length - 1];
    document.querySelector("#winner-card .name").textContent = teamName(teams, winner.team_id);
    document.querySelector("#winner-card .pts").textContent = `${winner.gw_points} pts this gameweek`;
    document.querySelector("#loser-card .name").textContent = teamName(teams, loser.team_id);
    document.querySelector("#loser-card .pts").textContent = `${loser.gw_points} pts this gameweek`;

    // Standings table
    let rows = "";
    for (const r of latest) {
      const prev = prevRanks[r.team_id];
      let change = "—";
      if (prev !== undefined) {
        const delta = prev - r.league_rank;
        if (delta > 0) change = `<span class="rank-up">▲ ${delta}</span>`;
        else if (delta < 0) change = `<span class="rank-down">▼ ${Math.abs(delta)}</span>`;
        else change = "–";
      }
      rows += `<tr>
        <td class="num">${r.league_rank}</td>
        <td>${teamName(teams, r.team_id)}</td>
        <td class="num">${r.gw_points}</td>
        <td class="num">${r.total_points}</td>
        <td class="num">${change}</td>
      </tr>`;
    }
    document.getElementById("standings-wrap").innerHTML = `
      <table>
        <thead><tr><th class="num">#</th><th>Team</th><th class="num">GW pts</th><th class="num">Total</th><th class="num">Δ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;

    // Progression chart — cumulative total_points per team across all gameweeks
    const gws = [...new Set(rankings.map(r => r.gw))].sort((a, b) => a - b);
    const datasets = teams.map((t, i) => {
      const hue = (i * 47) % 360;
      const points = gws.map(gw => {
        const row = rankings.find(r => r.gw === gw && r.team_id === t.team_id);
        return row ? row.total_points : null;
      });
      return {
        label: t.team_name,
        data: points,
        borderColor: `hsl(${hue}, 55%, 40%)`,
        backgroundColor: `hsl(${hue}, 55%, 40%)`,
        tension: 0.25,
        pointRadius: 2,
        borderWidth: 2,
      };
    });

    new Chart(document.getElementById("progressionChart"), {
      type: "line",
      data: { labels: gws.map(g => `GW${g}`), datasets },
      options: {
        responsive: true,
        plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
        scales: { y: { title: { display: true, text: "Cumulative points" } } }
      }
    });

    // Prize fund breakdown
    const rules = await sb("prize_rules?select=*&active=eq.true&order=amount.desc");
    const labels = {
      weekly_winner: "Weekly winner (highest score each gameweek)",
      league_4th: "League — 4th place",
      league_3rd: "League — 3rd place",
      league_2nd: "League — 2nd place",
      league_1st: "League — 1st place (champion)",
      lms_cup: "Cup 1 — Last Man Standing Cup",
      champion_of_champions_cup: "Cup 2 — Champion of Champions Cup",
      fpl_league_cup: "Cup 3 — FPL League Cup",
      top_score: "Highest single-gameweek score, all season",
    };
    let totalPot = 0;
    let prizeRows = "";
    for (const r of rules) {
      const isWeekly = r.frequency === "per_gameweek";
      const lineTotal = isWeekly ? r.amount * 38 : r.amount;
      totalPot += lineTotal;
      prizeRows += `<tr>
        <td>${labels[r.rule_name] || r.rule_name}</td>
        <td class="num">£${r.amount}${isWeekly ? " / gw" : ""}</td>
        <td class="num">£${lineTotal}</td>
      </tr>`;
    }
    document.getElementById("prize-wrap").innerHTML = `
      <table>
        <thead><tr><th>Prize</th><th class="num">Amount</th><th class="num">Season total</th></tr></thead>
        <tbody>${prizeRows}</tbody>
        <tfoot><tr><td><strong>Total prize pot</strong></td><td></td><td class="num"><strong>£${totalPot}</strong></td></tr></tfoot>
      </table>`;

  } catch (err) {
    console.error(err);
    document.getElementById("league-meta").textContent = "";
    document.getElementById("standings-wrap").innerHTML =
      `<p class="error">Couldn't load standings (${err.message}). Check the Supabase URL/key in this file.</p>`;
  }
}

render();
</script>
</body>
</html>
