name: Collect FPL standings
run-name: ${{ inputs.gameweek && format('GW recap {0} GW{1}', inputs.season, inputs.gameweek) || 'GW update check' }}

on:
  schedule:
    # Hourly 08:17-18:17 UTC (covers 09:17+ UK in both GMT and BST). Most runs are a
    # quick no-op; the first one after a gameweek is final AND due (09:00 UK the day
    # after the last fixture) does the real update. Offset minute avoids the
    # top-of-hour congestion that makes GitHub cron slots flaky.
    - cron: "17 8-18 * * *"
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Leave BLANK to auto-detect the next finished gameweek, or enter 1-38 to force one"
        required: false
        type: string
      season:
        description: "Season start year, e.g. 2026 for 2026/27 (blank = current season)"
        required: false
        type: string

concurrency:
  group: fpl-weekly-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process completed gameweek
        env:
          TARGET_GAMEWEEK: ${{ inputs.gameweek }}
          TARGET_SEASON: ${{ inputs.season }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_update.py
