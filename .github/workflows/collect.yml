name: Collect FPL standings
run-name: GW recap ${{ inputs.season }} GW${{ inputs.gameweek }}

on:
  workflow_dispatch:
    inputs:
      gameweek:
        description: "Completed FPL gameweek to process (1-38)"
        required: true
        type: string
      season:
        description: "Season start year, e.g. 2026 for 2026/27"
        required: true
        type: string

concurrency:
  group: fpl-weekly-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process completed gameweek
        env:
          TARGET_GAMEWEEK: ${{ inputs.gameweek }}
          TARGET_SEASON: ${{ inputs.season }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_update.py
